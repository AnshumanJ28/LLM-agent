services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.app
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../traces:/app/traces
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
    depends_on:
      - viewer

  viewer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.viewer
    ports:
      - "8501:8501"
    volumes:
      - ../traces:/app/traces
